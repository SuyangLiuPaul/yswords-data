# yswords-data — central data source for YsWords and friends.
#
# Static deploy of `data/`. Consumers (yswords.netlify.app) read each
# dataset URL with permissive CORS so any Flutter / web client can
# fetch them.

[build]
  publish = "."
  # Build pre-flight: validate schemas, regenerate manifest. If
  # validate.mjs exits non-zero, Netlify aborts the deploy.
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"

# All JSON datasets — wide-open CORS, 5-minute browser cache.
# Edge cache is short so a fresh GitHub Actions push propagates
# within minutes; clients still cache 5 min to avoid refetch storms.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
    Content-Type = "application/json; charset=utf-8"

# Daily archive snapshots (news_insights infinite-scroll consumer,
# added 2026-07-22). Each dated file is immutable once written, so it
# gets a long/immutable cache unlike the 5-minute live daily_news.json
# above. index.json DOES change (a new date gets prepended once a day)
# so it keeps the short live-data cache — this block is intentionally
# placed after the archive wildcard so it wins for that one path.
[[headers]]
  for = "/data/archive/*.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/data/archive/index.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
    Content-Type = "application/json; charset=utf-8"

# Schemas are also public so external integrators can validate.
[[headers]]
  for = "/schemas/*.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json; charset=utf-8"

# Friendly landing page if anyone hits the root.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Bible Evidence images mirrored from Wikimedia (~65 MB across 716
# files). Wide-open CORS so the YsWords web app can decode them in
# canvaskit + img-tag modes alike. Long edge cache because the files
# never change once a release is mirrored — content is keyed by
# evidence_id + index.
#
# 2026-08-02: Cross-Origin-Resource-Policy added. Access-Control-Allow-Origin
# alone is NOT enough for a consumer page that sets
# `Cross-Origin-Embedder-Policy: require-corp` (YsWords does this on its
# skwasm/wasm builds, which need a crossOriginIsolated context to run the
# renderer multithreaded). Under require-corp the browser blocks every
# cross-origin subresource that doesn't explicitly opt in with CORP —
# and Flutter loads these as no-cors <img> tags, which never consult
# ACAO. Without this header all 716 evidence images fail to load on
# such a build. `cross-origin` grants no access that ACAO: * didn't
# already grant; these are public mirrored images.
[[headers]]
  for = "/images/evidence/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# Mirrored news-article images (news_insights consumer, added 2026-07-22).
# Some source CDNs (SBS) send Access-Control-Allow-Origin: null on their
# own images, which blocks Flutter Web's CanvasKit renderer from decoding
# them. refresh-news.mjs mirrors those specific images here so they get a
# real CORS grant. Filenames are keyed by article id, which can recur
# across a story's multiple same-day regenerations, so this is a normal
# overwrite target, not an ever-growing immutable set — short cache.
[[headers]]
  for = "/images/news/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
