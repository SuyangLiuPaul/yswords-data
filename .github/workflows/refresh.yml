name: Refresh daily news

# Cron fires every hour. Each run pulls RSS, hits the deep-match
# cache for stories already seen, and only commits if data/daily_news.json
# actually changes (the `git diff --cached --quiet` guard below).
#
# Why hourly and not every 30 minutes:
#   • Source RSS feeds (Guardian, BBC, SBS, DW) update on a 1–3 hour
#     rhythm anyway — sub-hourly polling mostly finds nothing new.
#   • Cold-cache runs take 10–16 min with the Gemini free-tier 5 RPM
#     throttle (13s between deep-match calls × ~38 stories + body
#     translation). At */30 a slow run could still be finishing as
#     the next one queues, causing visible lag during heavy news.
#   • Hourly halves AI calls + Netlify rebuilds with no perceptible
#     freshness loss for a Bible-news devotional.
#
# Previous setup before that was four Sydney hours (06/11/16/19)
# gated by scripts/schedule-window.mjs (file still present, unused).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    # Promote NETLIFY_AUTH_TOKEN to job-level env so step `if:` blocks
    # can branch on its presence. Neither `secrets.X` nor a step-level
    # `env.X` is readable from `if:`; only job-level / workflow-level
    # env vars are.
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh news data
        env:
          # The refresh script accepts the key under any of these
          # variable names (preferring GEMINI_API_KEYS > GEMINI_API_KEY
          # > OPENAI_API_KEY). Wiring all three so renaming the secret
          # in GitHub Actions doesn't break AI enrichment.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # Default to gemini-2.5-pro (thinking-capable) for the deep-match
          # pipeline. Override via the OPENAI_MODEL secret only if you need
          # to revert to flash for cost/throughput reasons. The script
          # script itself also defaults to gemini-2.5-pro, but pinning
          # here makes it explicit at the workflow level too.
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gemini-2.5-pro' }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          NEWS_MIN_ITEMS_PER_SECTION: 10
          NEWS_MAX_ITEMS_PER_SECTION: 18
        run: npm run refresh

      - name: Validate refreshed data
        run: npm run validate

      - name: Regenerate manifest
        run: npm run manifest

      - name: Commit + push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_news.json data/_manifest.json
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh daily news"
          # Race-proof push: a human or another concurrent cron run
          # may have pushed in the time between checkout and now, so
          # the first push can be rejected with non-fast-forward. Pull
          # --rebase and retry. If THAT fails we let the step fail
          # loudly — better than silently dropping a refresh.
          if ! git push 2>&1; then
            echo "Push rejected (likely concurrent commit). Pulling --rebase and retrying."
            git pull --rebase --autostash origin main
            git push
          fi
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      # Two ways to deploy after a commit:
      #
      #   A. Direct CLI deploy (preferred — bypasses Netlify's git
      #      clone, which has been broken with "Host key verification
      #      failed" errors). Requires NETLIFY_AUTH_TOKEN secret.
      #      Deploys the local checkout straight to the CDN, so the
      #      JSON the bot just committed is on yswords-data.netlify.app
      #      within ~10 seconds.
      #
      #   B. Build-hook POST (fallback — only fires when the auth
      #      token isn't configured). Requires Netlify's git
      #      integration to be healthy, which it currently is not.
      #      Kept around so users who prefer hook-based deploys can
      #      still wire those in.
      #
      # Two consumers rebuild from the same JSON:
      #   1. yswords-data.netlify.app  — this repo's static deploy.
      #   2. newsbible.netlify.app     — Astro UI; build script pulls
      #      daily_news.json from yswords-data via sync-data.mjs then
      #      runs astro build.
      # NETLIFY_AUTH_TOKEN is promoted to job-level env (see top of
      # this job), which is the only env scope readable from step
      # `if:` expressions. `secrets.X` and step-level `env.X` are
      # both invisible to the conditional evaluator.
      - name: Deploy yswords-data via Netlify CLI
        if: steps.commit.outputs.did_commit == 'true' && env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=. \
            --site="${NETLIFY_SITE_ID_YSWORDS_DATA}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="cron refresh @ $(date -u +%FT%TZ)"
        env:
          NETLIFY_SITE_ID_YSWORDS_DATA: e1252e5a-a37e-4ba4-94ab-046ee9e6da9b

      - name: Trigger Netlify build hooks (legacy fallback)
        if: steps.commit.outputs.did_commit == 'true' && env.NETLIFY_AUTH_TOKEN == ''
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -fsS -X POST "$NETLIFY_BUILD_HOOK" -d '{}' || true
            echo "Triggered yswords-data build via hook."
          else
            echo "Neither NETLIFY_AUTH_TOKEN nor NETLIFY_BUILD_HOOK set; new commit will sit unpublished."
          fi
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}

      # newsbible.netlify.app rebuild — build hooks still work for it
      # because the broken-link issue is on the yswords-data site,
      # not the DailyNews site. Fires regardless of which yswords-data
      # path was used above.
      - name: Trigger DailyNews (newsbible) rebuild
        if: steps.commit.outputs.did_commit == 'true'
        run: |
          if [ -n "$DAILYNEWS_BUILD_HOOK" ]; then
            curl -fsS -X POST "$DAILYNEWS_BUILD_HOOK" -d '{}' || true
            echo "Triggered DailyNews build via hook."
          else
            echo "DAILYNEWS_BUILD_HOOK not set; newsbible.netlify.app will not auto-rebuild."
          fi
        env:
          DAILYNEWS_BUILD_HOOK: ${{ secrets.DAILYNEWS_BUILD_HOOK }}
