name: Refresh daily news

# Cron fires every 30 minutes. Each run pulls RSS, hits the deep-match
# cache for stories already seen, and only commits if data/daily_news.json
# actually changes (the `git diff --cached --quiet` guard below). Cost
# stays bounded:
#   • most 30-min fires find no new RSS items -> no commit, no rebuild
#   • new stories use ~1 Gemini call each (well under 1500 RPD free tier)
#   • Netlify only rebuilds on push, so empty cron fires are free
#
# Previous setup gated to four Sydney hours (06/11/16/19) via
# scripts/schedule-window.mjs. That file is still in the repo but
# unused — kept around in case we want to revert.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh news data
        env:
          # The refresh script accepts the key under any of these
          # variable names (preferring GEMINI_API_KEYS > GEMINI_API_KEY
          # > OPENAI_API_KEY). Wiring all three so renaming the secret
          # in GitHub Actions doesn't break AI enrichment.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # Default to gemini-2.5-pro (thinking-capable) for the deep-match
          # pipeline. Override via the OPENAI_MODEL secret only if you need
          # to revert to flash for cost/throughput reasons. The script
          # script itself also defaults to gemini-2.5-pro, but pinning
          # here makes it explicit at the workflow level too.
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gemini-2.5-pro' }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          NEWS_MIN_ITEMS_PER_SECTION: 10
          NEWS_MAX_ITEMS_PER_SECTION: 18
        run: npm run refresh

      - name: Validate refreshed data
        run: npm run validate

      - name: Regenerate manifest
        run: npm run manifest

      - name: Commit + push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_news.json data/_manifest.json
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh daily news"
          git push
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      # Netlify's GitHub-app webhook integration is finicky to set up
      # via API. Use build hooks (private POST URLs) that Netlify
      # always honours. Hook URLs are secrets: leaking only lets
      # someone trigger redeploys, no data exposure.
      #
      # Two consumers rebuild from the same JSON:
      #   1. yswords-data.netlify.app  — this repo's static deploy.
      #   2. newsbible.netlify.app     — Astro UI; build script
      #      pulls daily_news.json from yswords-data via
      #      `scripts/sync-data.mjs` then runs `astro build`.
      - name: Trigger Netlify builds
        if: steps.commit.outputs.did_commit == 'true'
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -fsS -X POST "$NETLIFY_BUILD_HOOK" -d '{}' || true
            echo "Triggered yswords-data build."
          else
            echo "NETLIFY_BUILD_HOOK not set; skipping yswords-data trigger."
          fi
          if [ -n "$DAILYNEWS_BUILD_HOOK" ]; then
            curl -fsS -X POST "$DAILYNEWS_BUILD_HOOK" -d '{}' || true
            echo "Triggered DailyNews build."
          else
            echo "DAILYNEWS_BUILD_HOOK not set; skipping DailyNews trigger."
          fi
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          DAILYNEWS_BUILD_HOOK: ${{ secrets.DAILYNEWS_BUILD_HOOK }}
