name: Refresh songs

# Weekly re-sync of data/songs.json from the three church catalogues:
#
#   • fydt.org                        — 福音电台, via its fydt-api/v1 JSON API
#   • cahayapengharapan.org           — Indonesian, /pujian/ pages
#   • christiandiscipleschurch.org    — English + Chinese, Drupal index
#
# Only metadata and media URLs are captured; the audio/video/PDFs stay
# on each church's own servers.
#
# Weekly rather than the hourly cadence daily-news uses: a church song
# catalogue gains entries a few times a year, and each run makes ~600
# HEAD requests against those three servers to check for link rot. No
# reason to be a heavier neighbour than the data warrants.
#
# `--verify` HEAD-checks every media URL after the sync and exits
# non-zero if any are dead, so the run fails loudly instead of
# publishing a catalogue full of broken play buttons. That failure mode
# is not hypothetical — the app's Songs feature was deleted once
# because links rotted silently after fydt.org migrated its backend.
#
# Manual run: Actions → Refresh songs → Run workflow.

on:
  workflow_dispatch:
  schedule:
    # Daily at 18:00 UTC ≈ 02:00 / 04:00 next day in HK / Sydney —
    # off-peak for all four upstream sites.
    #
    # 2026-08-10: was weekly (Sundays only). Daily means a hymn posted
    # on a Tuesday reaches the app on Wednesday instead of the
    # following Monday. The sync itself is light — a few hundred
    # requests — so the extra neighbourliness cost is small. The
    # expensive part, `--verify`, stays weekly; see the sync step.
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-08-10: a run once took 2h12m — christiandiscipleschurch.org
    # started refusing the runner and every request sat until its
    # timeout. The script now aborts verification on a run of timeouts,
    # but this is the backstop: a weekly catalogue sync has no business
    # occupying a runner for hours whatever goes wrong upstream.
    timeout-minutes: 30

    # Job-level so the deploy step's `if:` can branch on its presence —
    # neither `secrets.X` nor a step-level `env.X` is readable from
    # `if:`. Same reasoning as refresh.yml.
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      # No third-party Python packages — the script is stdlib only, so
      # there is nothing to pip install.

      # The sync's own tests, offline and ~0.2 s. They exist because
      # every guard in sync_songs.py was written after an incident and
      # none of them had a test until 2026-09-05; four guards elsewhere
      # in these repos turned out that day to be impossible to make
      # fail. Runs BEFORE the sync so a broken script is caught without
      # touching a church server.
      - name: Sync-script tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      # `--verify` HEAD-checks all ~1400 media URLs. It is by far the
      # heaviest thing we do to the church servers — and the run that
      # took 2h12m was entirely verification — so it stays weekly even
      # though the sync itself is now daily. Link rot is slow; a broken
      # URL found on Sunday rather than Wednesday costs nothing.
      #
      # A manual run always verifies: that is exactly when someone is
      # looking for rot.
      # stderr is teed to a file for the record-failure step below; the
      # guards print their refusals there. `set +e` so a guard failure
      # reaches that step instead of killing the job on the spot.
      #
      # Three outcomes, not two (2026-09-05):
      #   rc=0  clean run          → publish, job green
      #   rc=2  DEGRADED run       → publish, job RED
      #   rc=1  refused to write   → publish nothing, job RED
      # rc=2 exists because one upstream having a bad day used to
      # withhold all six sources — including two that had never been
      # published even once. A snapshot where the degraded source keeps
      # the rows it had last run is safe to ship; a run that produced
      # it is still not a success.
      #
      # Deliberately NOT setting $CDC_MIN_INTERVAL here. The pacing
      # that keeps christiandiscipleschurch.org answering lives in the
      # script, where it can be tested; a workflow `env:` that silently
      # overrides a script default is the trap AGENTS.md records for
      # OPENAI_MODEL, and this is the same shape of mistake.
      - name: Sync songs catalogue
        id: sync
        run: |
          set +e
          if [ "$(date -u +%u)" = "7" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Sunday / manual run → verifying every media URL"
            python3 scripts/sync_songs.py --verify 2> >(tee /tmp/sync.err >&2)
          else
            echo "Weekday run → sync only, verification runs Sundays"
            python3 scripts/sync_songs.py 2> >(tee /tmp/sync.err >&2)
          fi
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          EVENT: ${{ github.event_name }}

      # 2026-08-23 this step decided whether the JOB failed: a repeat of
      # yesterday's guard refusal exited 0 and the run went green.
      #
      # 2026-09-05 that is removed. Between 2026-08-30 and 2026-09-04
      # "Refresh songs" reported success on six consecutive days while
      # committing a failure state and publishing nothing, and the app
      # repo's own "Sync songs" went red instead — the wrong repo
      # showing the failure of this one. Suppressing an EMAIL is a
      # defensible call; reporting a run as successful when it did not
      # do its job is not, because the run status is the only signal
      # anyone else reads.
      #
      # The script still runs, and still does the useful half: it
      # classifies the failure as news or a repeat, keeps the streak in
      # .github/refresh-songs-state.json, and now writes both an
      # annotation and a job-summary line. It just no longer gets a
      # vote on the exit code.
      - name: Record failure reason
        if: steps.sync.outputs.rc != '0'
        run: |
          python3 scripts/failure_dedup.py /tmp/sync.err || true

      # A good run means the previous failure streak is over; clear the
      # state so the NEXT failure alerts immediately as fresh news.
      - name: Clear failure state on success
        if: steps.sync.outputs.rc == '0'
        run: |
          [ -f .github/refresh-songs-state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/refresh-songs-state.json
          git commit -m "chore: refresh-songs recovered — clear failure state"
          git push || { git pull --rebase origin main && git push; }

      # rc 0 (clean) and rc 2 (degraded but publishable) both
      # produced a catalogue on disk; rc 1 did not.
      - name: Validate against schema
        if: steps.sync.outputs.rc == '0' || steps.sync.outputs.rc == '2'
        run: npm run validate

      - name: Regenerate manifest
        if: steps.sync.outputs.rc == '0' || steps.sync.outputs.rc == '2'
        run: npm run manifest

      - name: Commit + push
        if: steps.sync.outputs.rc == '0' || steps.sync.outputs.rc == '2'
        id: commit
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs.json data/_manifest.json
          if git diff --cached --quiet; then
            echo "No catalogue changes; skipping commit."
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh songs catalogue"
          # Race-proof push, same strategy as refresh.yml: the hourly
          # news cron can land between this run's checkout and its push.
          # These files are generated, so replaying ours on top of a
          # fresh remote is always the right resolution — but note we
          # only ever restore OUR files, leaving whatever the news cron
          # wrote to data/daily_news.json intact.
          if ! git push 2>&1; then
            echo "Push rejected — replaying on fresh remote."
            cp data/songs.json /tmp/songs.json.fresh
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/songs.json.fresh data/songs.json
            # Rebuild the manifest against the reset tree so it
            # checksums the OTHER datasets as the remote has them,
            # not as our stale checkout did.
            npm run manifest
            git add data/songs.json data/_manifest.json
            if git diff --cached --quiet; then
              echo "Remote already had this exact content; nothing to push."
              echo "did_commit=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: refresh songs catalogue"
            git remote set-url origin \
              "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          fi
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      # Direct CLI deploy — Netlify's git integration on this site has
      # been unreliable ("Host key verification failed"), so refresh.yml
      # deploys the checkout straight to the CDN and this does the same.
      - name: Deploy yswords-data via Netlify CLI
        if: steps.commit.outputs.did_commit == 'true' && env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=. \
            --site="${NETLIFY_SITE_ID_YSWORDS_DATA}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="songs refresh @ $(date -u +%FT%TZ)"
        env:
          NETLIFY_SITE_ID_YSWORDS_DATA: e1252e5a-a37e-4ba4-94ab-046ee9e6da9b

      - name: Trigger Netlify build hook (fallback)
        if: steps.commit.outputs.did_commit == 'true' && env.NETLIFY_AUTH_TOKEN == ''
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -fsS -X POST "$NETLIFY_BUILD_HOOK" -d '{}' || true
            echo "Triggered yswords-data build via hook."
          else
            echo "Neither NETLIFY_AUTH_TOKEN nor NETLIFY_BUILD_HOOK set; the new commit will sit unpublished."
          fi
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}

      # The run's status must say what the run actually did.
      #
      # This is deliberately the LAST step and `if: always()`: the
      # publish steps above have already deployed whatever was safe to
      # deploy, so failing here costs nothing but the truth. It is also
      # the only step that can fail the job — every earlier step is
      # either gated on the rc or swallows its own error — which means
      # there is exactly one place to look for "why is this red".
      - name: Report the run's real outcome
        if: always()
        run: |
          rc="${{ steps.sync.outputs.rc }}"
          {
            echo "## Refresh songs"
            echo
            echo "sync exit code: \`${rc}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0)
              echo "Clean run." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::error title=Songs sync degraded::A source did not answer fully. The catalogue WAS published with that source's previous rows carried forward; see _meta.sourceHealth in data/songs.json and the DEGRADED lines above."
              {
                echo
                echo "**DEGRADED** — published, but at least one source did"
                echo "not answer fully. Grep the log for \`DEGRADED\`, or read"
                echo "\`_meta.sourceHealth\` in \`data/songs.json\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            "")
              # The sync step never ran — something earlier in the job
              # failed (the script's own tests, npm ci, the checkout).
              # Say that, rather than blaming the sync for a refusal it
              # never made.
              echo "::error title=Songs job failed before the sync::An earlier step failed; the catalogue was not even attempted."
              {
                echo
                echo "**JOB FAILED BEFORE THE SYNC RAN** — see the first red"
                echo "step above."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "::error title=Songs sync refused to write::Nothing was published this run."
              {
                echo
                echo "**REFUSED TO WRITE** — nothing was published. The"
                echo "previous catalogue is still live and is now a day older."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
